[project]
name = "pharma-twin-backend"
version = "0.1.0"
description = "Digital Twin of India's Pharmaceutical Logistics Network - Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "alembic==1.13.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "python-dotenv==1.0.1",
    "websockets==12.0",
    "geopy==2.4.1",
    "networkx==3.3",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "redis==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "black==24.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "black==24.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ANN", "ARG", "PTH", "PL", "TRY", "SIM", "TCH", "TID"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ARG001", "ARG002", "B008", "C408", "PTH118", "PTH123", "TCH001", "TCH003", "TRY003", "PLW2901", "SIM103", "SIM117"]
fix = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true